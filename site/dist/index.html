    @media(max-width:900px){.app,.app.sidebar-collapsed{grid-template-columns:1fr}.sidebar,.app.sidebar-collapsed .sidebar{position:fixed;left:0;z-index:45;width:250px;transform:translateX(-102%);opacity:1;pointer-events:auto;transition:.25s;box-shadow:var(--shadow)}.sidebar.open,.app.sidebar-collapsed .sidebar.open{transform:none}.topbar{padding:0 16px}.action-btn .sync-label{display:none}.content{padding:26px 18px 50px}.source-grid{grid-template-columns:1fr}.article{grid-template-columns:36px minmax(0,1fr);gap:12px}.article.has-cover{grid-template-columns:36px minmax(0,1fr) 124px}.article.has-cover .article-side{grid-column:2}.article-cover{grid-column:3;grid-row:1;width:124px;height:78px}.article-side{grid-column:2;flex-direction:row;align-items:center;justify-content:space-between}.page-head{align-items:flex-start}.head-stat{display:none}}
    @media(max-width:560px){.top-actions .action-btn{display:none}.content{padding:22px 14px}.page-head h1{font-size:27px}.attention-rule{align-items:flex-start}.article{padding:17px 0}.article.has-cover{grid-template-columns:30px minmax(0,1fr) 104px}.article-cover{width:104px;height:68px}.article h2{font-size:18px}.summary{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.rank{font-size:18px}.filterbar{overflow:auto;flex-wrap:nowrap;padding-bottom:5px}.filter-btn{white-space:nowrap}.reader-head{padding:20px 20px 16px}.reader-head h1{font-size:25px}.reader-body{padding:30px 22px 80px;font-size:18px}.field-grid,.setting-row{grid-template-columns:1fr}.setting-row{gap:12px}.modal{padding:20px}.source-controls{flex-wrap:wrap}.scroll{width:min(158vw,calc(58vh * 2.55))}.scroll-copy{width:74vw;padding:14px 5px 8px;transform:translateY(12px)}.scroll-seal{width:36px;height:36px;margin-bottom:11px;font-size:11px}.scroll-title{font-size:clamp(31px,9.2vw,43px);letter-spacing:.12em;margin-left:.12em}.scroll-rule{margin:14px auto 10px;width:58px}.scroll-welcome{font-size:14px;line-height:1.62}.scroll-office{margin-top:5px;font-size:11px}.startup-skip{margin-top:11px;font-size:10.5px;letter-spacing:.1em}.startup-skip::before,.startup-skip::after{width:14px;margin:0 6px 4px}}
    @media(prefers-reduced-motion:reduce){.bamboo-shadow{animation:none}.scroll-paper{clip-path:none;animation:none}.scroll-roller.left{transform:translateX(-50%);animation:none}.scroll-roller.right{transform:translateX(50%);animation:none}.scroll-landscape,.scroll-seal,.scroll-title,.scroll-rule,.scroll-welcome,.scroll-office{opacity:1;transform:none;filter:none;animation:none}.startup-skip{opacity:1;transform:none;animation:none}.startup,.scroll,.scroll-landscape{transition-duration:.2s}}

<body>

      <nav id="nav"></nav>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="mobileMenu" aria-label="打开导航">☰</button>

        <div class="top-actions"><button class="action-btn" id="syncBtn">↻ <span class="sync-label">同步全部</span></button><button class="icon-btn" id="themeBtn" aria-label="切换主题">◐</button><button class="icon-btn" id="addBtn" aria-label="添加来源">＋</button></div>

  <div class="modal" id="sourceModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle">添加信息源</h2><p class="modal-sub" id="modalSub">录入 RSS / Atom 地址，并决定它是否值得进入日常注意力队列。</p>
    <form id="sourceForm">
      <div class="field"><label for="feedUrl">RSS / Atom 地址</label><input id="feedUrl" type="url" placeholder="http://127.0.0.1:8001/feed/MP_WXS_数字.rss" /><div class="field-help"><span>公众号需先由本机采集器生成；这里不是微信文章链接。</span><a id="openCollectorLink" href="http://127.0.0.1:8001/add-subscription" target="_blank" rel="noopener">启动并打开公众号采集器 ↗</a></div></div>
      <div class="field"><label for="sourceName">来源名称</label><input id="sourceName" required placeholder="例如：田野研究通讯" /></div>
      <div class="field"><label for="sourceDescription">来源说明</label><input id="sourceDescription" placeholder="这个来源主要提供什么内容" /></div>
      <div class="field-grid"><div class="field"><label for="sourceTier">来源等级</label><select id="sourceTier"><option>B · 一般来源</option><option>A · 核心来源</option><option>C · 低优先级</option></select></div><div class="field"><label for="sourceCategory">信息类型</label><select id="sourceCategory"><option value="OTHER">其他</option><option value="ACADEMIC">学术信息</option><option value="NEWS">新闻</option><option value="LONGFORM">文献 / 长文</option><option value="COMMENTARY">评论 / 思想</option><option value="TECH">技术</option></select></div></div>
      <div class="checkline"><p><strong>进入 Inbox</strong><small>该来源的新未读文章会进入日常处理队列。</small></p><button type="button" class="switch on" id="modalInbox" aria-label="切换是否进入 Inbox"></button></div>
      <div class="checkline"><p><strong>保持同步</strong><small>关闭后暂停获取新文章，历史内容仍然保留。</small></p><button type="button" class="switch on" id="modalEnabled" aria-label="切换是否保持同步"></button></div>
      <div class="modal-actions"><button type="button" class="action-btn" id="cancelModal">取消</button><button type="submit" class="action-btn primary" id="saveSourceBtn">保存来源</button></div>
    </form>
  </div>
  <div class="modal" id="collectorModal" role="dialog" aria-modal="true" aria-labelledby="collectorModalTitle">
    <h2 id="collectorModalTitle">从公众号采集器选择</h2>
    <p class="modal-sub">勾选尚未接入的公众号。新来源先按 B 级、其他类型接入，之后可在信息源卡片中继续调整。</p>
    <div class="collector-toolbar"><button type="button" class="quiet-action" id="selectUnjoinedSources">勾选未接入</button></div>
    <div class="collector-list" id="collectorSourceList"><div class="collector-source"><span></span><span>正在读取采集器…</span></div></div>
    <div class="modal-actions"><button type="button" class="action-btn" id="cancelCollectorModal">取消</button><button type="button" class="action-btn primary" id="importCollectorSources">接入所选来源</button></div>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const cats={NEWS:'新闻',ACADEMIC:'学术信息',LONGFORM:'文献 / 长文',COMMENTARY:'评论 / 思想',TECH:'技术',OTHER:'其他'};
    const categoryIcons={NEWS:'▱',ACADEMIC:'◇',LONGFORM:'▥',COMMENTARY:'◌',TECH:'⌘',OTHER:'·'};
    const chineseNumber=n=>n<=10?['零','一','二','三','四','五','六','七','八','九','十'][n]:n<20?`十${n===10?'':['零','一','二','三','四','五','六','七','八','九'][n-10]}`:`${['零','一','二','三'][Math.floor(n/10)]}十${n%10?['零','一','二','三','四','五','六','七','八','九'][n%10]:''}`;
    const today=new Date();
    const monthText=`${chineseNumber(today.getMonth()+1)}月`;
    const dayText=today.getDate()<=10?`${chineseNumber(today.getDate())}日`:chineseNumber(today.getDate());
    const sealDate=document.getElementById('scrollSealDate');
    sealDate.innerHTML=`${monthText}<br>${dayText}`;
    sealDate.setAttribute('aria-label',`${monthText}${dayText}`);
    const courtGreetings=[
      {office:'司礼监 · 奉迎',text:'司礼监恭迎圣驾，今日章奏已陈于御前，静候陛下批红。'},
      {office:'吏部 · 奏报',text:'百官名册已清，诸司各守其职，恭请陛下临阁裁示。'},
      {office:'户部 · 奏报',text:'度支有数，仓廪有章，四方消息已汇，请陛下御览。'},
      {office:'礼部 · 奉迎',text:'玉漏初转，万机待理，礼部恭迎陛下入阁。'},
      {office:'兵部 · 奏报',text:'边报已整，舆图在案，恭候陛下运筹定夺。'},
      {office:'刑部 · 奏报',text:'案牍俱陈，是非待断，伏请陛下圣裁。'},
      {office:'工部 · 奏报',text:'百工就绪，营造有程，愿陛下今日所谋皆有所成。'},
      {office:'都察院 · 奏报',text:'风闻言事，照察百端，今日所见皆候陛下明鉴。'},
      {office:'翰林院 · 候旨',text:'一卷新开，万象入目。臣等谨候陛下览阅。'}
    ];
    const welcome=courtGreetings[Math.floor(Math.random()*courtGreetings.length)];
    document.getElementById('scrollWelcome').textContent=welcome.text;
    document.getElementById('scrollOffice').textContent=welcome.office;
    function enterCabinet(){const startup=document.getElementById('startup');if(!startup||startup.classList.contains('leaving'))return;startup.classList.add('leaving');startup.setAttribute('aria-hidden','true');setTimeout(()=>startup.remove(),900)}
    document.getElementById('startup').addEventListener('click',enterCabinet);
    const seedSources=[
      {id:'s1',name:'三联学术通讯',description:'社会科学、人文研究与新书资讯。',tier:'A',category:'ACADEMIC',inbox:true,enabled:true,articles:18,unread:4,last:'8 分钟前'},
      {id:'s2',name:'城市与治理',description:'城市政策、基层治理与公共生活观察。',tier:'A',category:'COMMENTARY',inbox:true,enabled:true,articles:26,unread:3,last:'14 分钟前'},
      {id:'s3',name:'田野笔记',description:'民族志方法、经验材料与青年学者书写。',tier:'B',category:'LONGFORM',inbox:true,enabled:true,articles:12,unread:2,last:'26 分钟前'},
      {id:'s4',name:'界面新闻 · 社会',description:'高频社会新闻与公共议题报道。',tier:'C',category:'NEWS',inbox:false,enabled:true,articles:57,unread:16,last:'3 分钟前'},
      {id:'s5',name:'系统结构通讯',description:'编程语言、系统软件与开源生态。',tier:'B',category:'TECH',inbox:true,enabled:true,articles:21,unread:3,last:'32 分钟前'},
      {id:'s6',name:'会议与征稿',description:'学术会议、工作坊与征稿信息汇总。',tier:'C',category:'ACADEMIC',inbox:false,enabled:true,articles:34,unread:9,last:'1 小时前'}
    ];
    const seedArticles=[
      {id:'a1',source:'s1',title:'县域社会中的青年流动：家庭策略与教育选择',summary:'从三组县域家庭的生命史出发，讨论教育投入、跨城迁移与代际期待如何彼此塑造。',author:'周祺',hours:2,mins:12,read:false,saved:true,progress:0,content:['县域并不是城市化进程中静止的背景。对许多年轻人来说，它既是出发地，也是必须反复返回并重新协商生活位置的地方。','当教育被视为家庭实现代际流动的主要路径，选择学校、迁移居所和配置照料资源就不再是孤立决定，而成为一套彼此咬合的家庭策略。','本文依据持续两年的访谈和参与观察，追踪三组家庭在升学、就业与照料之间的反复权衡。经验材料显示，流动并不总是通往大城市，也可能表现为县城与乡镇之间更细碎、更频繁的移动。','理解这些选择，需要同时看到制度机会、家庭资源与地方关系网络。青年并非单独行动，他们的每一次离开和返回都牵动着整个家庭。']},
      {id:'a2',source:'s2',title:'街道如何回应新的公共空间需求',summary:'社区食堂、口袋公园与共享空间背后，是一套正在变化的基层协商机制。',author:'陈潇',hours:3,mins:9,read:false,saved:false,progress:.34,content:['公共空间的需求往往以极其具体的方式出现：一张长椅该放在哪里，活动室要在几点关闭，儿童能否在走廊里奔跑。','这些看似琐碎的问题，构成了城市治理最真实的现场。它们要求街道、社区与居民之间形成可持续的协商，而不仅是一次性的意见征集。','当空间资源有限时，治理的关键并非找到一个让所有人满意的答案，而是让分歧可见、让选择有据可循，并保留再次调整的余地。']},
      {id:'a3',source:'s3',title:'在“熟人”与“研究对象”之间：一次田野关系的复盘',summary:'研究关系并不会在离开田野后自动结束，写作本身也持续改变着双方的位置。',author:'林沐',hours:5,mins:18,read:false,saved:false,progress:.68,content:['田野结束的时间通常比研究计划里写下的日期更晚。离开现场之后，消息仍会抵达，关系仍在延续，过去的承诺也会重新出现。','研究者常用“知情同意”描述伦理边界，但关系中的期待并不总能被一份文本充分容纳。写作和发表都会让双方重新理解彼此的位置。','复盘并不是为了找到一种完全无损的研究方式，而是识别哪些权力差异曾被熟悉感掩盖，以及研究者可以如何更诚实地承担后果。']},
      {id:'a4',source:'s5',title:'小模型推理系统的内存调度新实践',summary:'围绕 KV Cache、批处理与异构设备，整理一套可复现的性能分析方法。',author:'系统结构编辑部',hours:6,mins:15,read:false,saved:true,progress:0,content:['推理性能的瓶颈并不总在计算。当上下文变长、并发请求增多，内存带宽和缓存管理会迅速成为主要约束。','一套可靠的分析方法应先区分吞吐与时延，再观察请求长度分布、批处理策略和设备之间的数据移动。','优化的价值不只在于更高的峰值数字，还在于负载变化时仍能保持可预测的响应。']},
      {id:'a5',source:'s1',title:'劳动过程研究的新问题意识',summary:'数字平台改变了劳动控制的技术形式，也重新组织了工人之间的可见性与合作。',author:'贺安',hours:8,mins:11,read:false,saved:false,progress:0,content:['劳动过程研究长期关心控制如何进入日常工作的细部。平台化并没有取消这一问题，而是把控制写入排序、计价和派单。','算法并非一个封闭的技术对象。劳动者通过经验、互助和试探持续解释它，也在实践中形成新的集体知识。']},
      {id:'a6',source:'s4',title:'多地发布公共文化空间延时开放方案',summary:'部分图书馆与文化馆将在周末延长开放时间，并试点夜间预约服务。',author:'记者组',hours:1,mins:5,read:false,saved:false,progress:0,content:['多地近期公布公共文化设施延时开放安排。新增时段主要集中在周末和节假日，部分场馆将提供夜间预约。','相关方案同时强调人员配置与安全管理，具体开放时间以各场馆公告为准。']},
      {id:'a7',source:'s4',title:'县城夜校升温：年轻人的“下班后共同体”',summary:'从技能学习到社交连接，夜校正成为县城青年重新组织闲暇生活的一种方式。',author:'许宁',hours:4,mins:7,read:true,saved:true,progress:1,content:['夜校在县城重新出现，并不是对某种历史形式的简单复刻。课程、组织者与参与者都发生了变化。','对许多人来说，持续参加一门课的价值不只在学习，也在于获得一种稳定的共同时间。']},
      {id:'a8',source:'s6',title:'社会学青年论坛 2026 年秋季征稿',summary:'本届论坛以“变化中的地方社会”为主题，接受经验研究与方法讨论论文。',author:'会务组',hours:9,mins:3,read:false,saved:false,progress:0,content:['论坛现面向青年学者与研究生征集论文。投稿摘要需说明研究问题、材料来源与主要发现。','本来源未进入 Inbox；你是在主动浏览学术信息时看到这篇文章。收藏和继续阅读功能仍然正常。']},
      {id:'a9',source:'s2',title:'作为基础设施的社区协商',summary:'把协商理解为一种需要维护、更新和持续投入的社会基础设施。',author:'吴越',hours:18,mins:14,read:true,saved:false,progress:1,content:['协商并不是会议开始时才出现。居民之间的熟悉程度、信息传播的路径和对程序的信任，早已塑造了讨论可能达到的位置。','因此，社区协商应被看作基础设施：它需要日常维护，也会因为长期不用而失灵。']},
      {id:'a10',source:'s5',title:'从编译器视角理解 Agent 工具调用',summary:'工具描述、参数校验与执行反馈，正在形成一种新的程序接口边界。',author:'顾清',hours:22,mins:10,read:false,saved:false,progress:.19,content:['当模型调用工具时，系统需要在自然语言意图与可执行接口之间建立稳定边界。这与编译器处理源语言到目标行为的转换有相似之处。','类型、约束与错误信息不仅服务于开发者，也直接影响模型能否形成可靠的调用策略。']},

            await new Promise(resolve=>setTimeout(resolve,1000));

          const publishedText=entry.querySelector('pubDate, published, updated, date')?.textContent||'';let publishedAt=null;if(publishedText){const parsedDate=new Date(publishedText);if(!Number.isNaN(parsedDate.getTime())&&parsedDate.getFullYear()>=2000)publishedAt=parsedDate.toISOString()}
          state.articles.push({id:'a'+Date.now()+Math.random().toString(16).slice(2),source:s.id,title,summary,author:cleanText(entry.querySelector('author, creator')?.textContent)||s.name,publishedAt,mins:Math.max(3,Math.min(30,Math.round(cleanText(raw).length/500)||5)),read:false,saved:false,progress:0,tags:[],cover,url,content:[cleanText(raw)||summary]});added++

    function parseDelimited(text){
      const delimiter=(text.split(/\r?\n/,1)[0].match(/\t/g)||[]).length>(text.split(/\r?\n/,1)[0].match(/,/g)||[]).length?'\t':',';
      const rows=[];let row=[],field='',quoted=false;
      for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(ch===delimiter&&!quoted){row.push(field.trim());field=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(field.trim());if(row.some(Boolean))rows.push(row);row=[];field=''}else field+=ch}
      row.push(field.trim());if(row.some(Boolean))rows.push(row);if(rows.length<2)return[];
      const aliases={name:['公众号名称','名称','name'],feedUrl:['RSS地址','Feed地址','订阅地址','feedurl','url'],tier:['等级','tier'],category:['类型','category'],inbox:['进入批红','inbox'],description:['说明','description']};
      const headers=rows.shift().map(value=>value.toLowerCase());const index={};Object.entries(aliases).forEach(([key,names])=>index[key]=headers.findIndex(header=>names.map(x=>x.toLowerCase()).includes(header)));
      return rows.map(values=>{const read=key=>index[key]>=0?(values[index[key]]||'').trim():'';const inbox=read('inbox').toLowerCase();return{name:read('name'),feedUrl:read('feedUrl'),tier:(read('tier')||'B').toUpperCase(),category:(read('category')||'OTHER').toUpperCase(),inbox:inbox?['1','true','是','开启','on'].includes(inbox):undefined,description:read('description')}}).filter(row=>row.name&&row.feedUrl)
    }

    }

    $('#syncBtn').onclick=syncAll;$('#themeBtn').onclick=()=>{state.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';applyTheme();render()};$('#addBtn').onclick=()=>openModal();$('#cancelModal').onclick=closeModal;$('#cancelCollectorModal').onclick=closeCollectorModal;$('#selectUnjoinedSources').onclick=selectUnjoinedSources;$('#importCollectorSources').onclick=importCollectorSources;$('#modalInbox').onclick=()=>{state.modalInbox=!state.modalInbox;$('#modalInbox').classList.toggle('on',state.modalInbox)};$('#modalEnabled').onclick=()=>{state.modalEnabled=!state.modalEnabled;$('#modalEnabled').classList.toggle('on',state.modalEnabled)};$('#sourceForm').onsubmit=e=>{e.preventDefault();const name=$('#sourceName').value.trim(),feedUrl=$('#feedUrl').value.trim(),tier=$('#sourceTier').value[0],category=$('#sourceCategory').value,description=$('#sourceDescription').value.trim()||'尚未填写来源说明。';if(!state.editingSourceId&&!feedUrl){toast('请填写 RSS / Atom 地址');return}if(state.editingSourceId){const s=src(state.editingSourceId);Object.assign(s,{name,feedUrl,tier,category,description,inbox:state.modalInbox,enabled:state.modalEnabled});persist();closeModal();render();toast('信息源已更新')}else{const id='s'+Date.now();state.sources.unshift({id,name,description,tier,category,inbox:state.modalInbox,enabled:state.modalEnabled,articles:0,unread:0,last:'尚未同步',feedUrl});persist();closeModal();state.view='sources';render();toast('来源已添加，可以开始同步')}};$('#scrim').onclick=()=>{closeReader();closeModal();closeCollectorModal();closeMobile()};$('#mobileMenu').onclick=toggleSidebar;matchMedia('(max-width:900px)').addEventListener('change',()=>{closeMobile();applySidebarState()});document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#searchInput').focus()}if(e.key==='Escape'){closeReader();closeModal();closeCollectorModal();closeMobile()}});
    function runPageSearch(showFeedback=false){const input=$('#searchInput'),value=input.value.trim();if(!value){if(showFeedback)toast('请输入搜索关键词');input.focus();return false}if(state.view==='search')return runGlobalSearch(showFeedback);state.search=value;render();if(showFeedback)toast('已筛选当前页面');return true}
    function runGlobalSearch(showFeedback=false){const input=$('#searchInput'),value=input.value.trim();if(!value){if(showFeedback)toast('请输入搜索关键词');input.focus();return false}if(state.view!=='search')state.searchReturnView=state.view;state.view='search';state.filter='all';state.search=value;render();if(showFeedback)toast(`全局找到 ${visibleArticles().length} 篇文章`);return true}
    $('#searchInput').oninput=e=>{const value=e.target.value;if(state.view==='search'&&!value.trim())state.view=state.searchReturnView||'inbox';state.search=value;render()};
    $('#searchInput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();runPageSearch(true)}};
    $('#searchBtn').onclick=()=>runGlobalSearch(true);
    function registerWebMCP(){const mc=document.modelContext;if(!mc?.registerTool)return;const tools=[{name:'list_inbox_articles',title:'列出批红定案',description:'返回当前尚未处理、且来源规则或单篇选择允许进入批阅队列的文章。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>state.articles.filter(a=>!a.read&&articleInInbox(a)).map(a=>({id:a.id,title:a.title,source:src(a.source)?.name}))},{name:'mark_article_read',title:'标记文章已读',description:'将指定文章标记为已读，并同步更新可见列表。',inputSchema:{type:'object',properties:{articleId:{type:'string'}},required:['articleId'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({articleId})=>{const a=state.articles.find(x=>x.id===articleId);if(!a)throw new Error('文章不存在');a.read=true;persist();render();return {id:a.id,isRead:true}}},{name:'set_source_inbox',title:'设置来源是否进入 Inbox',description:'控制某个来源的新未读文章是否进入批阅队列，不影响同步。',inputSchema:{type:'object',properties:{sourceId:{type:'string'},includeInInbox:{type:'boolean'}},required:['sourceId','includeInInbox'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false,consequentialHint:false},execute:({sourceId,includeInInbox})=>{const s=src(sourceId);if(!s)throw new Error('来源不存在');s.inbox=includeInInbox;persist();render();return {id:s.id,includeInInbox:s.inbox,enabled:s.enabled}}}];tools.forEach(t=>Promise.resolve(mc.registerTool(t)).catch(()=>{}))}
    async function init(){await loadBackend();state.articles.forEach(article=>{if(!Array.isArray(article.tags))article.tags=[];if(!Array.isArray(article.content))article.content=[article.summary||'请打开原文阅读。']});applyTheme();applySidebarState();render();registerWebMCP()}
    $('#openCollectorLink').onclick=openCollectorAdmin;
    init();
  </script>
